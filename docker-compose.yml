# AI Stack — Brian
# Ollama runs natively on the host (not containerized)
# Roadmap: Open WebUI → LiteLLM → MCP Servers → NVIDIA NIM

services:

  # ── Open WebUI ────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    env_file:
      - .env
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - litellm

  # ── LiteLLM ───────────────────────────────────────────────────
  # Single routing gateway for Ollama, Anthropic, and NVIDIA NIM.
  # Requires config/litellm.yaml (copy from config/litellm.yaml.example).
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── mcpo (MCP-to-OpenAPI bridge for Open WebUI) ─────────────────
  # Exposes a filesystem MCP server over HTTP so models used through Open WebUI
  # can read files in this repo as a Tool Server. Mounted read-only at the OS
  # level — even a misbehaving model cannot write through this mount, regardless
  # of what tools the MCP server exposes. See docs/mcp.md for setup.
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["--api-key", "${MCPO_API_KEY}", "--", "npx", "-y", "@modelcontextprotocol/server-filesystem", "/projects"]
    volumes:
      - .:/projects:ro

  # ── NVIDIA NIM (Step 4) ───────────────────────────────────────
  # NIM services added here per model when ready. See docs/nim.md.

volumes:
  open-webui-data:
    external: true
    name: open-webui
